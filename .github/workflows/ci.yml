name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

# One run per PR (or branch): a new push cancels the previous run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          # package.json engines: >=20.9; development uses Node 22 LTS.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
        env:
          # Obvious placeholders: the build doesn't contact Supabase, and no
          # secrets (and no service_role key) are needed or used.
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: PLACEHOLDER-ANON-KEY

  # Next CI phase (not enabled yet): SQL (pgTAP), integration and Playwright
  # tests need a full local Supabase stack in Docker (`supabase start`).
  # Run them locally: npm run db:start && npm run db:test &&
  # npm run test:integration && npm run test:e2e
